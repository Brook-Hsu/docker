name: "project"

services:
  backend:
    build:
      context: .
      dockerfile: ./tomcat.dockerfile
      args:
        - war_file=labboot-ajax/target/labboot-ajax.war
    ports:
      - "9080:8080"
    container_name: java
  frontend:
    build:
      context: .
      dockerfile: ./nginx.dockerfile
      args:
        - "build_dir=labvue-front/dist"
    ports:
      - "9173:80"
    container_name: vue
